<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Formulario</title>
</head>
<body>

<main class="container">
<div class="icone">
    <img src="">
</div>
<h1> Ganhe um iphone </h1>
<p>Preencha o Formulario para concorrer a um iphone</p>
<Form id="formulario">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Digite seu nome" required>

    <label for="email">E-MAIL</label>
    <input type="email" id="email" placeholder="Digite seu email" required>

    <label for="telefone">Informe um telefone para contato</label>
    <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
    <select  id="comonosconheceu">
        <option value="">selecione uma opção</option>
        <option value="Instagram">Instagram</option>
        <option value="Tik Tok">Tik Tok</option>
        <option value="Amigos">Amigos</option>
        <option value="todas as anteriores">Todas as anteriores</option>
    </select>
<label for="mensagem">OBSERVAÇÕES:</label>
<textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>
<button type="submit">Enviar solicitação</button>
</Form>
</main>



    <script src="./main.js"></script>


</body>
</html>
